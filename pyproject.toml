[project]
name = "pyavaspec"
version = "0.1.0"
description = "Pythonic control library for Avantes AvaSpec spectrometers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "E1nzbern", email = "42884262+E1nzbern@users.noreply.github.com" }]
keywords = [
    "avantes",
    "avasoftx",
    "avaspecx",
    "spectrometer",
    "spectroscopy",
    "avaspecx64",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/E1nzbern/pyavaspec"
Repository = "https://github.com/E1nzbern/pyavaspec"
Issues = "https://github.com/E1nzbern/pyavaspec/issues"
Documentation = "https://github.com/E1nzbern/pyavaspec/tree/main/docs"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyavaspec"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=1.14",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "twine>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pyavaspec"]
branch = true

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["dist", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/pyavaspec/__init__.py" = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["pyavaspec"]

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
